<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101214">
<title>他撮りガイドカメラ(仮)Web試作</title>
<style>
  /* 配置:オーナーの画面は1カラムの一覧。撮影者の画面は黒地に 4:5 の枠とシャッターだけ。 */
  :root {
    color-scheme: dark;
    --bg: #101214;
    --surface: #1a1e22;
    --line: #2c3238;
    --fg: #f1f3f4;
    --muted: #98a2ab;
    --accent: #ffd34d;   /* まだ合っていない */
    --ok: #3ddc84;       /* 合っている */
    --danger: #ff6b5e;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font);
    -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .screen { min-height: 100%; }
  .page {
    max-width: 560px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }
  h1 { font-size: 20px; margin: 0; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
    padding: 14px 18px; font-weight: 600; min-height: 52px;
  }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 40px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  /* お手本の一覧 */
  .templates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tpl {
    border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius);
    padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 8px;
  }
  .tpl[aria-pressed="true"] { border-color: var(--ok); }
  .tpl svg { width: 100%; height: auto; background: #262b31; border-radius: 8px; display: block; }
  .tpl .name { font-weight: 700; line-height: 1.3; }
  .tpl .meta { color: var(--muted); font-size: 13px; line-height: 1.4; }
  .notice {
    border: 1px solid var(--danger); color: var(--fg); border-radius: var(--radius);
    padding: 12px 14px; font-size: 14px;
  }

  /* 撮影者モード */
  #shoot {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .frame {
    position: relative; overflow: hidden; background: #15181b;
    width: min(100vw, calc((100dvh - 170px) * var(--aspect, .8)));
    aspect-ratio: var(--aspect, .8);
  }
  .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .18s ease-out; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }

  .sil-shadow { fill: none; stroke: rgba(0,0,0,.55); stroke-width: 9; stroke-linejoin: round; }
  .sil { fill: none; stroke: #fff; stroke-width: 5; stroke-dasharray: 2 14; stroke-linecap: round; stroke-linejoin: round; }
  .centerline { stroke: #fff; stroke-width: 2; stroke-dasharray: 10 8; opacity: .8; }
  .centerline-shadow { stroke: rgba(0,0,0,.5); stroke-width: 5; }
  .level { stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
  .level-shadow { stroke: rgba(0,0,0,.55); stroke-width: 12; stroke-linecap: round; }
  .hint { fill: var(--accent); stroke: rgba(0,0,0,.55); stroke-width: 3; paint-order: stroke; }
  .joint { fill: #5ad1ff; stroke: rgba(0,0,0,.6); stroke-width: 3; }
  #shoot[data-tilt="true"] .level, #shoot[data-ok="true"] .sil { stroke: var(--ok); }
  #shoot[data-ok="true"] .frame { box-shadow: 0 0 0 4px var(--ok); }
  #shoot[data-sensor="none"] .gauge { display: none; }

  .shutter {
    width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff; background: transparent;
    padding: 5px; flex: none;
  }
  .shutter::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; }
  #shoot[data-ok="true"] .shutter { border-color: var(--ok); }
  #shoot[data-ok="true"] .shutter::before { background: var(--ok); }
  .shutter:active::before { transform: scale(.9); }
  .shutter:disabled { opacity: .5; }
  .dots { display: flex; gap: 8px; height: 10px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a4047; }
  .dots i.done { background: #fff; }

  .lock {
    position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px;
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12);
    display: grid; place-items: center; overflow: hidden;
  }
  .lock svg { width: 20px; height: 20px; position: relative; }
  .lock::before {
    content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.4);
    transform: scaleY(0); transform-origin: bottom;
  }
  .lock.holding::before { transform: scaleY(1); transition: transform 1.2s linear; }
  .badge {
    position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: 12px;
    font-size: 12px; color: var(--muted); background: rgba(255,255,255,.1); padding: 4px 10px; border-radius: 99px;
  }
  .badge.pose { top: calc(48px + env(safe-area-inset-top, 0px)); }
  .sim {
    position: absolute; left: 10px; right: 10px; bottom: 6px; display: flex; gap: 12px;
    font-size: 12px; color: var(--muted); background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px;
  }
  .sim label { flex: 1; display: flex; gap: 6px; align-items: center; }
  .sim input { flex: 1; min-width: 0; }

  /* 返してね */
  #handback .page { min-height: 100dvh; justify-content: center; text-align: center; gap: 22px; }
  .big { font-size: 28px; font-weight: 800; line-height: 1.3; margin: 0; }
  .big small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); margin-top: 6px; }

  /* 結果 */
  .preview { width: 100%; border-radius: var(--radius); display: block; background: var(--surface); }
  .thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .thumbs button { padding: 0; border: 3px solid transparent; border-radius: 10px; background: none; overflow: hidden; }
  .thumbs button[aria-pressed="true"] { border-color: var(--ok); }
  .thumbs img { display: block; width: 100%; }
  .status { color: var(--muted); font-size: 14px; min-height: 1.6em; margin: 0; }
  pre.log {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; overflow: auto; max-height: 55dvh; margin: 0;
    white-space: pre-wrap; word-break: break-all;
  }
  @media (prefers-reduced-motion: reduce) { .flash.on { animation: none; } }
</style>
</head>
<body>

<!-- 1. お手本を選ぶ(オーナー) -->
<section id="picker" class="screen">
  <div class="page">
    <div class="row">
      <h1>お手本を選ぶ</h1>
      <button class="btn ghost small" id="open-log" type="button">ログ</button>
    </div>
    <p class="sub">選ぶ → 渡す → 点線に合わせて撮ってもらう。</p>
    <div class="templates" id="templates"></div>
    <div class="notice" id="notice" hidden></div>
    <button class="btn primary" id="start" type="button" disabled>カメラを許可して渡す</button>
    <p class="sub">撮影中は左上の鍵マークを長押しすると、この画面に戻ります。</p>
  </div>
</section>

<!-- 2. 撮影者モード -->
<section id="shoot" hidden data-ok="false" data-sensor="none">
  <div class="frame" id="frame">
    <video id="video" playsinline muted autoplay></video>
    <svg id="overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="flash" id="flash"></div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <button class="shutter" id="shutter" type="button" aria-label="5枚撮る"></button>
  <button class="lock" id="lock" type="button" aria-label="長押しでお手本の画面に戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </button>
  <span class="badge" id="sensor-badge" hidden>傾きセンサーなし</span>
  <span class="badge pose" id="pose-badge" hidden></span>
  <div class="sim" id="sim" hidden>
    <label>ピッチ <input id="sim-pitch" type="range" min="-20" max="20" step="0.1" value="6"></label>
    <label>ロール <input id="sim-roll" type="range" min="-20" max="20" step="0.1" value="-4"></label>
  </div>
</section>

<!-- 3. 本人に返す -->
<section id="handback" class="screen" hidden>
  <div class="page">
    <p class="big">撮れました<small>スマホを本人に返してください<br>Please hand the phone back</small></p>
    <button class="btn primary" id="to-result" type="button">写真を見る</button>
  </div>
</section>

<!-- 4. 選んで保存(オーナー) -->
<section id="result" class="screen" hidden>
  <div class="page">
    <h1>1枚選んで保存</h1>
    <img class="preview" id="preview" alt="選択中の写真">
    <div class="thumbs" id="thumbs"></div>
    <p class="status" id="save-status" role="status"></p>
    <div class="stack">
      <button class="btn primary" id="save" type="button">この写真を保存</button>
      <button class="btn" id="retake" type="button">撮り直してもらう</button>
      <button class="btn ghost" id="back-to-picker" type="button">お手本を選び直す</button>
    </div>
  </div>
</section>

<!-- ログ -->
<section id="log" class="screen" hidden>
  <div class="page">
    <div class="row">
      <h1>撮影ログ</h1>
      <button class="btn ghost small" id="close-log" type="button">閉じる</button>
    </div>
    <p class="sub">この端末のブラウザの中だけに保存しています。どこにも送信しません。</p>
    <pre class="log" id="log-body"></pre>
    <p class="status" id="log-status" role="status"></p>
    <div class="stack">
      <button class="btn" id="copy-log" type="button">コピー</button>
      <button class="btn ghost" id="clear-log" type="button">ログを消す</button>
    </div>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
